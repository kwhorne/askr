name: Split askr-laravel

# Mirror packages/laravel/ to the standalone kwhorne/askr-laravel repo that
# Packagist watches. Runs on every push to main that touches the package, and on
# version tags (which also create a matching release on the split repo).
#
# One-time setup: add a repo secret ASKR_LARAVEL_SPLIT_TOKEN — a fine-grained PAT
# with Contents: read/write on kwhorne/askr-laravel.

on:
  push:
    branches: [main]
    paths: ['packages/laravel/**', '.github/workflows/split-laravel.yml']
    tags: ['v*']

permissions:
  contents: read

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A missing token used to `exit 0`, so this job reported success while
      # publishing nothing — the package sat weeks behind on Packagist while every
      # release showed a green check.
      #
      # The fix is not "always fail without the token": publishing by hand with
      # scripts/publish-laravel-package.sh is a supported route, and a job that goes
      # red on a correct release teaches you to ignore red just as effectively.
      # So this step is best-effort, and the *verification* below is what decides the
      # outcome — it asks whether the package is published, not how it got there.
      - name: Subtree split + push to standalone main
        env:
          TOKEN: ${{ secrets.ASKR_LARAVEL_SPLIT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "::warning::ASKR_LARAVEL_SPLIT_TOKEN is not set — not pushing automatically. Publish with scripts/publish-laravel-package.sh."
            exit 0
          fi
          git subtree split --prefix=packages/laravel -b split
          git push --force \
            "https://x-access-token:${TOKEN}@github.com/kwhorne/askr-laravel.git" \
            split:main
          echo "SPLIT_SHA=$(git rev-parse split)" >> "$GITHUB_ENV"

      - name: Tag + release the split repo (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.ASKR_LARAVEL_SPLIT_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "no token — skipping, publish by hand"; exit 0; }
          [ -n "${SPLIT_SHA:-}" ] || { echo "nothing split — skipping"; exit 0; }
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            --repo kwhorne/askr-laravel \
            --target "$SPLIT_SHA" \
            --title "askr-laravel ${TAG#v}" \
            --notes "Laravel drivers for Askr ${TAG#v}. See the main CHANGELOG: https://github.com/kwhorne/askr/blob/main/CHANGELOG.md" \
            || echo "release $TAG already exists — skipping"

      # The verdict. Needs no credentials (the split repo and Packagist are public),
      # so it's equally valid whether the push above happened or someone ran
      # scripts/publish-laravel-package.sh by hand. Red means the release genuinely
      # isn't installable; re-run the job after publishing and it goes green.
      - name: Verify the release is installable
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          # Authenticated: unauthenticated api.github.com allows 60 requests an hour per
          # IP, and reporting "not published" because we were rate-limited would be a
          # false alarm on a perfectly good release. GITHUB_TOKEN can read a public repo.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          API="repos/kwhorne/askr-laravel/git/ref/tags/$TAG"
          for i in 1 2 3 4 5 6; do
            if out=$(gh api "$API" 2>&1); then
              echo "$TAG is present in kwhorne/askr-laravel"
              exit 0
            fi
            case "$out" in
              *"Not Found"* | *404*)
                echo "not there yet ($i/6)" ;;
              *)
                # Couldn't ask, which is not the same answer as "it isn't there".
                echo "::warning::could not query kwhorne/askr-laravel: $out"
                echo "$out" ;;
            esac
            sleep 10
          done
          echo "::error::$TAG is not in kwhorne/askr-laravel, so Packagist cannot serve it. Run scripts/publish-laravel-package.sh, then re-run this job."
          exit 1

      # Belt-and-braces auto-update: ping Packagist after the split push, so the
      # package refreshes even without a GitHub webhook / the Packagist app.
      # Optional — needs PACKAGIST_USERNAME + PACKAGIST_TOKEN secrets.
      - name: Notify Packagist
        continue-on-error: true
        env:
          PU: ${{ secrets.PACKAGIST_USERNAME }}
          PT: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          [ -n "$PT" ] || { echo "no PACKAGIST_TOKEN secret set — skipping"; exit 0; }
          curl -sf -XPOST -H 'content-type:application/json' \
            "https://packagist.org/api/update-package?username=${PU}&apiToken=${PT}" \
            -d '{"repository":{"url":"https://github.com/kwhorne/askr-laravel"}}' \
            && echo "Packagist notified"

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.2.0)'
        required: true

permissions:
  contents: write
  # Build provenance: `id-token` mints the OIDC token the attestation is bound to,
  # `attestations` writes it. Signing (below) needs neither — it uses a stored key —
  # so the two are independent halves: minisign answers "did the key holder make
  # this", provenance answers "was it built by this workflow from this commit".
  id-token: write
  attestations: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      # For a tag push this is the tag; for manual dispatch it's the branch the
      # workflow was started from (so it always has the packaging script).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}

      # Uses the pinned toolchain from rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config patchelf \
            libssl-dev libxml2-dev libonig-dev libsqlite3-dev \
            libicu-dev libcurl4-openssl-dev libpng-dev libjpeg-dev \
            libfreetype-dev libwebp-dev libzip-dev zlib1g-dev libpq-dev

      - name: Build embedded libphp (laravel profile)
        run: PROFILE=laravel ./scripts/build-libphp.sh

      - name: Build askr (release)
        run: cargo build --release

      - name: Package self-contained tarball
        run: ./scripts/package-release.sh

      - name: Smoke-test the package (relocated)
        run: |
          mkdir -p /tmp/pkgtest
          tar xzf dist/*.tar.gz -C /tmp/pkgtest
          PKG="$(ls -d /tmp/pkgtest/askr-*)"
          "$PKG/askr" --version
          "$PKG/askr-run.sh" doctor

      # A second, opt-in-features build so users get the durable L2 (SQL Anywhere)
      # and observability tiers without compiling from source. The default tarball
      # above is unchanged.
      - name: Build askr (full — sql-backend + observ + otel + http3)
        run: cargo build --release --features "sql-backend observ otel http3"

      - name: Package full tarball
        run: SUFFIX=-full ./scripts/package-release.sh

      # Sign every tarball. `askr upgrade` refuses a release with no signature once a
      # key is embedded in the binary, so this step failing must fail the release
      # rather than publish something that cannot be installed.
      #
      # The secret key is passwordless (`rsign generate -W`) because there is no
      # terminal here to answer a prompt.
      # rsign2 rather than the minisign C tool: the formats are the same spec and
      # interoperable, but this is the tool the key was generated with, `-W` makes
      # signing non-interactive without relying on how a passwordless key is prompted
      # for, and it always prehashes — which is what `askr upgrade` requires. The Rust
      # toolchain is already set up in this job, so installing it costs seconds next to
      # the PHP build.
      - name: Sign the tarballs
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY}" ]; then
            echo "::error::MINISIGN_SECRET_KEY is not set — releases must be signed." \
                 "Generate a key (docs/RELEASING.md step 0) and add the repository secret."
            exit 1
          fi
          if ! grep -q '^RW' keys/release.pub; then
            echo "::error::keys/release.pub holds no public key, so a signature could" \
                 "not be checked against anything. See docs/RELEASING.md step 0."
            exit 1
          fi
          cargo install rsign2 --locked
          umask 077
          printf '%s\n' "${MINISIGN_SECRET_KEY}" > "${RUNNER_TEMP}/release.key"
          for f in dist/*.tar.gz; do
            rsign sign -W -s "${RUNNER_TEMP}/release.key" -x "$f.minisig" \
                       -c "askr release" -t "askr $(basename "$f")" "$f"
          done
          rm -f "${RUNNER_TEMP}/release.key"
          # Prove the signatures verify against the key committed to this repository
          # *before* anyone can download them. A release signed with a key the binaries
          # do not trust is a release nobody can install.
          for f in dist/*.tar.gz; do
            rsign verify -p keys/release.pub -x "$f.minisig" "$f"
          done

      # Attestation is not a substitute for the signature: it binds the artifact to
      # this workflow and commit, verifiable with `gh attestation verify`, while the
      # signature is what the binary itself checks with no network and no GitHub.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.minisig

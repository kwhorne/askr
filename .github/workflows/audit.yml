name: Audit

# Advisories appear over time, not when you commit — so this runs on a schedule as
# well as when dependencies change. It's a separate workflow from CI on purpose: a
# new advisory in a transitive dependency shouldn't turn the build-and-test signal
# red for a commit that had nothing to do with it.
on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/*/Cargo.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/*/Cargo.toml"
  schedule:
    # Mondays, 06:00 UTC — before the Dependabot PRs land the same morning.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Read-only: the job reports through the workflow result, it doesn't file issues.
permissions:
  contents: read

jobs:
  audit:
    name: cargo audit (RUSTSEC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      # Installed with --locked and run directly rather than through
      # rustsec/audit-check: that action installs cargo-audit *unlocked*, so it
      # resolves the newest transitive dependencies and fails against our pinned
      # toolchain the moment one of them raises its MSRV (kstring 2.0.4 wanting
      # rustc 1.96 while we pin 1.95 — which is the whole point of pinning). The
      # audit tool's MSRV has nothing to do with ours, so don't couple them.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Scans Cargo.lock against the RustSec advisory database. This covers the Rust
      # dependency tree only — the embedded PHP (libphp) is C, pinned by
      # scripts/build-libphp.sh, and tracked through PHP's own release notes.
      - name: cargo audit
        run: cargo audit

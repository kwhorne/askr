name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  laravel-package:
    name: laravel package (contracts)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every major composer.json claims. Laravel 13 added four methods to the Queue
        # contract, AskrQueue didn't have them, and a concrete class missing an abstract
        # method is a fatal at class-load time — so the driver killed the worker on any
        # page that resolved the queue. Nothing tested any of these versions until then.
        laravel: ['11', '12', '13']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install against Laravel ${{ matrix.laravel }}
        working-directory: packages/laravel
        run: |
          composer require --no-interaction --no-progress --dev \
            "illuminate/support:^${{ matrix.laravel }}" \
            "illuminate/contracts:^${{ matrix.laravel }}" \
            "illuminate/queue:^${{ matrix.laravel }}" \
            "illuminate/cache:^${{ matrix.laravel }}" \
            "illuminate/database:^${{ matrix.laravel }}" \
            "illuminate/http:^${{ matrix.laravel }}" \
            "illuminate/broadcasting:^${{ matrix.laravel }}"
      - name: Contract conformance
        working-directory: packages/laravel
        run: php tests/contracts.php
      - name: Lint
        working-directory: packages/laravel
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

  docs:
    name: docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check-docs.py

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the pinned toolchain + components from rust-toolchain.toml and
      # caches the cargo registry/target keyed on the toolchain + Cargo.lock.
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # The slowest step is compiling PHP; cache the install keyed on the build
      # script (which pins the PHP version). Skip the build on a cache hit.
      - name: Cache libphp
        id: libphp
        uses: actions/cache@v6
        with:
          path: vendor/php-build/install
          key: libphp-minimal-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-libphp.sh') }}

      - name: Build embedded libphp (minimal profile)
        if: steps.libphp.outputs.cache-hit != 'true'
        run: ./scripts/build-libphp.sh

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Unit tests plus the end-to-end suite in crates/askr/tests/, which starts
      # the real binary and drives it over HTTP. The e2e tests need the libphp
      # built above, which is why they live in this job.
      - name: test (unit + end-to-end)
        run: cargo test --workspace

      # The optional features are part of the published surface (they make up the
      # `-full` build), so they have to compile clean too — a default-only check
      # lets a feature-gated regression through.
      - name: clippy (optional features)
        run: |
          for f in sql-backend observ otel http3 "sql-backend observ otel http3"; do
            echo "::group::features: $f"
            cargo clippy --workspace --all-targets --features "$f" -- -D warnings
            echo "::endgroup::"
          done

      - name: release build
        run: cargo build --release

  # Verifies the full Laravel-profile libphp compiles against Ubuntu's system
  # dev libraries (openssl/libxml2/oniguruma/sqlite via pkg-config).
  libphp-laravel-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache libphp (laravel)
        id: libphp
        uses: actions/cache@v6
        with:
          path: vendor/php-build/install
          key: libphp-laravel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-libphp.sh') }}

      - name: Install PHP build dependencies
        if: steps.libphp.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libssl-dev libxml2-dev libonig-dev libsqlite3-dev \
            libicu-dev libcurl4-openssl-dev libpng-dev libjpeg-dev \
            libfreetype-dev libwebp-dev libzip-dev zlib1g-dev libpq-dev

      - name: Build libphp (laravel profile)
        if: steps.libphp.outputs.cache-hit != 'true'
        run: PROFILE=laravel ./scripts/build-libphp.sh

      - name: Verify non-ZTS + shared object + built-in OPcache
        run: |
          test -f vendor/php-build/install/lib/libphp.so
          vendor/php-build/install/bin/php-config --version | grep -q '^8\.5'
          # PHP 8.5 compiles OPcache into libphp (no opcache.so) — check the symbol.
          nm -D vendor/php-build/install/lib/libphp.so | grep -qi 'accel_startup\|zend_accel'

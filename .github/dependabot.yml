version: 2

updates:
  # Rust dependencies for the shipped workspace. Patch and minor bumps are grouped
  # into one PR so the review load stays proportional to the risk; majors come
  # separately, because those are the ones that need reading.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      rust-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps"

  # The h3/h2 benchmark client is a standalone project excluded from the workspace
  # (scripts/h3bench). It isn't distributed, but it has its own lockfile, so keep it
  # from rotting — monthly is enough for a dev tool.
  - package-ecosystem: cargo
    directory: "/scripts/h3bench"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      h3bench:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(h3bench)"

  # Workflow actions. A pinned-but-stale action is a supply-chain surface of its own.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  # GitHub Actions are pinned to commit SHAs, not tags: the release job holds the
  # signing key, so an action whose tag was moved would sign whatever it produced. A
  # pin only stays honest if something moves it forward — that is this. Dependabot
  # reads the `# vN` comment beside each SHA and proposes the new SHA when the tag
  # advances.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
